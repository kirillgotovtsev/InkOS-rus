name: Предложение улучшения
description: Новая возможность или изменение существующей
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Задача
      description: Какую задачу вы решаете и что сейчас мешает?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как должно работать улучшение? При необходимости добавьте пример CLI.
      placeholder: |
        ```bash
        inkos <new-command> --flag value
        ```
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Другие варианты
      description: Какие обходные способы или альтернативы вы уже пробовали?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Дополнительные сведения
      description: Снимки экрана, связанные обращения, ссылки и другие материалы.
    validations:
      required: false
